# 株洲通 App 去广告与留白美化模块 (Quantumult X)
# 项目地址: https://github.com/huqios/QuantumultX
# 更新时间: 2026-09-23
# 功能说明: 
#   1. 开屏广告秒跳 (拦截穿山甲 / GroMore SDK 广告分发)
#   2. 去除首页顶部轮播 Banner 与中间腰封广告
#   3. 消除空数据引起的白框留白（注入纯净官方绿色出行背景）
#   4. 拦截第三方广告归因、转化追踪与数据埋点

hostname = appservice.zhuzhoubus.com, *.pangolin-sdk-toutiao*.com, *.pglstatp-toutiao.com, *.zijieapi.com, *.ctobsnssdk.com, *.volces.com

# 1. 首页广告拦截与留白美化脚本
^https?:\/\/appservice\.zhuzhoubus\.com\/gatewayServer\/public\/fusions\/getAdvertisements url script-response-body https://raw.githubusercontent.com/huqios/QuantumultX/refs/heads/main/%E6%A0%AA%E6%B4%B2%E9%80%9A-noad

# 2. 穿山甲 / GroMore 开屏与信息流广告拦截 (Mock 避免报错重试)
^https?:\/\/(.*\.pangolin-sdk-toutiao.*|.*\.pglstatp-toutiao.*)\/api\/ad\/ url reject-dict
^https?:\/\/(.*\.pangolin-sdk-toutiao.*|.*\.pglstatp-toutiao.*)\/.* url reject-200
^https?:\/\/.*\.zijieapi\.com\/(monitor.*|get_domains) url reject-200
^https?:\/\/.*\.ctobsnssdk\.com\/service\/.* url reject-200
^https?:\/\/.*\.volces\.com\/.* url reject-200

# 3. 广告转化与追踪上报拦截
^https?:\/\/.*\.wldmarket\.com\/.* url reject-200
^https?:\/\/gungnir\.xiaojukeji\.com\/.* url reject-200
